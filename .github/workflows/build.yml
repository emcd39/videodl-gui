name: Build videodl Windows EXE

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # 每天北京时间 00:00 (UTC 16:00) 执行
    - cron: '0 16 * * *'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Checkout upstream videodl
      uses: actions/checkout@v4
      with:
        repository: CharlesPikachu/videodl
        path: videodl-upstream
        fetch-depth: 0

    - name: Copy videodl source to workspace
      run: |
        Copy-Item -Recurse -Path "videodl-upstream/videodl" -Destination "." -Force
        Copy-Item -Path "videodl-upstream/requirements.txt" -Destination "." -Force
        Remove-Item -Recurse -Force "videodl-upstream"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Install project dependencies
      run: |
        pip install -r requirements.txt

    - name: Build videodl.exe
      run: |
        pyinstaller --clean build_exe.spec --workpath=./build --distpath=./dist -y

    - name: Build videodl_gui.exe
      run: |
        pyinstaller --clean build_gui_exe.spec --workpath=./build_gui --distpath=./dist_gui -y

    - name: Copy videodl.exe to GUI directory
      run: |
        Copy-Item -Path "dist/videodl.exe" -Destination "dist_gui/videodl_gui/videodl.exe" -Force

    - name: Package release files
      run: |
        New-Item -ItemType Directory -Path "release" -Force
        Compress-Archive -Path "dist_gui/videodl_gui/*" -DestinationPath "release/videodl_gui.zip"

    - name: Build NSIS installer
      run: |
        # Install NSIS using chocolatey (pre-installed on GitHub Actions Windows runners)
        choco install nsis -y

        # Build installer using full path (more reliable than PATH refresh)
        & "C:\Program Files (x86)\NSIS\makensis.exe" "install.nsi"

        # Move installer to release folder
        Move-Item -Path "install.exe" -Destination "release/videodl-setup.exe" -Force

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: videodl-windows
        path: |
          release/videodl_gui.zip
          release/videodl-setup.exe
        retention-days: 30

    - name: Get release date
      id: date
      run: |
        echo "date=$(Get-Date -Format 'yyyy.MM.dd')" >> $env:GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: videodl Windows ${{ steps.date.outputs.date }}
        body: |
          ## videodl Windows 自动构建

          **版本**: ${{ steps.date.outputs.date }}
          **构建时间**: ${{ github.event.head_commit.timestamp }}
          **提交信息**: ${{ github.event.head_commit.message }}

          ## 下载说明

          **推荐**: 下载 `videodl-setup.exe` 安装程序，双击安装即可。
          **便携版**: 下载 `videodl_gui.zip` 并解压即可使用。

          ## 包含文件

          ### 安装包 (videodl-setup.exe)
          - 自动安装到 `%USERPROFILE%\AppData\Local\videodl`
          - 自动创建桌面快捷方式 `videodl_gui`
          - 支持卸载

          ### 便携版 (videodl_gui.zip)
          - `videodl_gui.exe` - GUI 界面程序
          - `videodl.exe` - 核心下载程序

          ## 使用方法

          ### 安装包
          1. 下载 `videodl_setup.exe`
          2. 双击运行，按提示完成安装
          3. 桌面会出现 `videodl_gui` 快捷方式
          4. 双击快捷方式启动程序

          ### 便携版
          1. 解压 `videodl_gui.zip`
          2. 运行 `videodl_gui.exe`
          3. 输入视频链接，选择保存目录
          4. 点击"开始下载"

          ---
          上游项目: https://github.com/CharlesPikachu/videodl
        draft: false
        prerelease: false
        files: |
          release/videodl_gui.zip
          release/videodl-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
